[project]
name = "jml-automation"
version = "1.0.0"
description = "Automated Joiner-Mover-Leaver security workflow (Okta, Google Workspace, 1Password, Jamf, Slack)"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # dummy tokens in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
